name: Build public source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '9.0.x'
      - name: Ensure VSTO runtime prerequisite
        shell: pwsh
        run: ./eng/Ensure-VstoRuntime.ps1
      - name: Build source, run tests and create local installers
        shell: pwsh
        run: ./eng/Build.ps1 -Configuration Release -Rebuild -Installer
      - name: Hash candidate installers
        shell: pwsh
        run: |
          Get-ChildItem installer/bin -Filter *.msi -Recurse | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(($_.FullName + '.sha256'), ($digest + '  ' + $_.Name + "`n"))
          }
      - name: Retain source-build results and unsigned candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-build-candidates
          if-no-files-found: error
          path: |
            installer/bin/**/*.msi
            installer/bin/**/*.sha256
            TestResults/*.trx
            TestResults/feature-acceptance.json
