name: Build public source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '9.0.x'
      - name: Ensure VSTO runtime prerequisite
        shell: pwsh
        run: ./eng/Ensure-VstoRuntime.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install pinned icon authoring dependencies
        shell: pwsh
        run: npm.cmd --prefix tools/icon-composer ci
      - name: Validate icon authoring and production SVG output
        shell: pwsh
        run: |
          $env:OE_ICON_EXPORTER = (Resolve-Path eng/Export-IconComposerSvg.ps1).Path
          $env:OE_ICON_PRODUCTION_DIR = Join-Path $pwd 'artifacts/icon-composer-bundle/production'
          $env:OE_ICON_ARTIFACTS_DIR = Join-Path $pwd 'artifacts/icon-composer-bundle/previews'
          $env:OE_ICON_EVIDENCE_PATH = Join-Path $pwd 'artifacts/icon-composer-bundle/light-dark-size.json'
          New-Item -ItemType Directory -Force -Path artifacts/icon-composer-bundle | Out-Null
          npm.cmd --prefix tools/icon-composer test 2>&1 | Tee-Object -FilePath artifacts/icon-composer-bundle/ci-validation.log
          if ($LASTEXITCODE -ne 0) { throw 'Icon authoring regressions failed.' }
          $run = Get-Content $env:OE_ICON_EVIDENCE_PATH -Raw | ConvertFrom-Json
          ./eng/Test-IconComposerExport.ps1 -ProductionDirectory $run.outputDirectories.production
      - name: Build source, run tests and create local installers
        shell: pwsh
        run: ./eng/Build.ps1 -Configuration Release -Rebuild -Installer
      - name: Hash candidate installers
        shell: pwsh
        run: |
          Get-ChildItem installer/bin -Filter *.msi -Recurse | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(($_.FullName + '.sha256'), ($digest + '  ' + $_.Name + "`n"))
          }
      - name: Retain source-build results and unsigned candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-build-candidates
          if-no-files-found: error
          path: |
            installer/bin/**/*.msi
            installer/bin/**/*.sha256
            TestResults/*.trx
            TestResults/feature-acceptance.json
            artifacts/icon-composer-bundle/**
            artifacts/icon-composer-export/*.log
